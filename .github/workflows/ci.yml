name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sysvena:
    # This repository hosts the gates, so it calls them locally; other repos use
    # sysvena/.github/.github/workflows/sysvena-gates.yml@main.
    uses: ./.github/workflows/sysvena-gates.yml
    permissions:
      contents: read
      pull-requests: read
      packages: read
    with:
      changeset: false
