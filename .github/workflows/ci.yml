name: CI

# Checks of this repository itself. The org ruleset runs the gates
# (sysvena-gates.yml) from a pinned commit, never from a PR here, so this
# workflow tests the PR's own version of the gates: actionlint (with
# shellcheck) over every workflow, tests/gates/run.sh over the gate scripts,
# and the tests of the Dependabot changeset script.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image bundles shellcheck, so `run:` scripts are checked too. Its
      # version lives in tools/actionlint/Dockerfile, which Dependabot updates
      # (it does not update `uses: docker://`, dependabot/dependabot-core#8362).
      - name: Check workflow files
        run: |
          set -euo pipefail
          file=tools/actionlint/Dockerfile
          image=$(sed -n 's/^FROM[[:space:]]\{1,\}//p' "$file")
          if [ "$(grep -c '^FROM' "$file")" -ne 1 ] \
            || ! grep -Eq '^rhysd/actionlint:[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$' <<< "$image"; then
            echo "::error::$file must have exactly one line 'FROM rhysd/actionlint:<version>@sha256:<digest>'."
            exit 1
          fi
          echo "actionlint image: $image"
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" -color

  gate-tests:
    name: Gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck the scripts
        run: shellcheck tests/gates/run.sh tests/gates/stub/gh tests/e2e/*.sh scripts/*.sh scripts/lib/*.sh tests/scripts/*.sh

      - name: Check the scripts are safe to edit while they run
        run: tests/scripts/edit-safe.sh

      - name: Test the retry of GitHub reads in the scripts
        run: tests/scripts/gh-retry.sh

      - name: Test the retry of downloads in the gates
        run: tests/scripts/retry-download.sh

      - name: Run the gate tests
        run: tests/gates/run.sh

      - name: Test the commit step of the Dependabot changeset workflow
        run: tests/scripts/dependabot-changeset-commit.sh

      # Node 24, the major every sysvena repository pins in .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The tests compare the script with Changesets itself (@changesets/git,
      # a development dependency).
      - name: Test the Dependabot changeset script
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/scripts/dependabot-changeset.test.mjs

      # As the plan job of dependabot-changeset.yml installs it: outside the
      # repository, without development dependencies. The script must load.
      - name: Load the Dependabot changeset script with its production install
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sysvena"
          mkdir -p "$dir"
          cp -r scripts package.json package-lock.json "$dir/"
          cd "$dir"
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          [ ! -e node_modules/@changesets ]
          node --input-type=module -e 'await import("./scripts/dependabot-changeset.mjs")'

  # The one check the org ruleset `require-build` requires (repositories with
  # the custom property `ci-build` = true). It fails unless every job above
  # succeeded: a skipped job reports "Success" to a required check, and a job
  # that needs a failed one is skipped (GitHub Docs, troubleshooting required
  # status checks). `always()` and not `!cancelled()`: a cancelled run must
  # fail this check too, not skip it; the step cannot hang (no checkout, jq on
  # an env var) and has a timeout.
  ci-result:
    name: CI result
    if: always()
    needs: [actionlint, gate-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::Not every CI job succeeded."
            exit 1
          fi
