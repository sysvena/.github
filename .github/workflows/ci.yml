name: CI

# Checks of this repository itself. The org ruleset runs the gates
# (sysvena-gates.yml) from a pinned commit, never from a PR here, so this
# workflow tests the PR's own version of the gates: actionlint (with
# shellcheck) over every workflow, and tests/gates/run.sh over the gate scripts.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image bundles shellcheck, so `run:` scripts are checked too.
      - name: Check workflow files
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  gate-tests:
    name: Gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck the scripts
        run: shellcheck tests/gates/run.sh tests/gates/stub/gh tests/e2e/*.sh scripts/*.sh

      - name: Run the gate tests
        run: tests/gates/run.sh
