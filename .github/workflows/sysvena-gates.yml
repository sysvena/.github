name: sysvena gates

# Shared PR gates for every sysvena repository. The org ruleset
# `require-sysvena-gates` requires this workflow on the default branch of every
# repository, so GitHub runs it on each PR without any file in that repository.
# It detects what to check from the repository itself:
#   - changeset:   `.changeset/config.json` exists
#   - agent rules: package.json depends on `@sysvena/agent-rules`
#   - lessons:     `scripts/check-lessons.mjs` exists
#
# A ruleset runs a workflow only on the default `pull_request` activity types
# (opened, synchronize, reopened) and ignores `types`, so none are set here.
# The gates read the title, labels and files of the PR from the API, not from
# the event payload, so a re-run of an older run checks the current PR.
#
# Workflows that upload artifacts set `retention-days: 7` (artifacts share the
# 2 GB Packages storage; the org keeps logs for 30 days).

on:
  pull_request:

concurrency:
  group: sysvena-gates-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changeset: ${{ steps.detect.outputs.changeset }}
      agent-rules: ${{ steps.detect.outputs.agent-rules }}
      lessons: ${{ steps.detect.outputs.lessons }}
      nvmrc: ${{ steps.detect.outputs.nvmrc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect
        id: detect
        run: |
          flag() { if eval "$1"; then echo true; else echo false; fi; }
          {
            echo "changeset=$(flag '[ -f .changeset/config.json ]')"
            echo "agent-rules=$(flag '[ -f package.json ] && grep -q "\"@sysvena/agent-rules\"" package.json')"
            echo "lessons=$(flag '[ -f scripts/check-lessons.mjs ]')"
            echo "nvmrc=$(flag '[ -f .nvmrc ]')"
          } | tee -a "$GITHUB_OUTPUT"

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TITLE=$(gh api "repos/$REPO/pulls/$PR" --jq '.title')
          pattern='^(feat|fix|chore|docs|refactor|test|perf|ci|build|revert)(\([a-z0-9][a-z0-9._-]*\))?!?: [^ ].*$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must be '<type>(<area>): <summary>' with type feat, fix, chore, docs, refactor, test, perf, ci, build or revert. Got: $TITLE"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters; keep it at 72 or fewer."
            exit 1
          fi
          echo "PR title OK: $TITLE"

  changes:
    name: Changeset and regression test
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REQUIRE_CHANGESET: ${{ needs.detect.outputs.changeset }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" > pr.json
          jq -r '.title' pr.json > title.txt
          jq -r '.labels[].name' pr.json > labels.txt
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.status != "removed") | .filename' > changed.txt
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > touched.txt
          echo "Changed files:"; sed 's/^/  /' touched.txt
          failed=0

          # Changeset: shipped files need a .changeset/*.md (docs, agent files and CI are exempt).
          if [ "$REQUIRE_CHANGESET" != "true" ]; then
            echo "No .changeset/config.json: changesets are not used in this repository."
          elif [[ "$HEAD_REF" == changeset-release/* ]]; then
            echo "Release PR: no changeset needed."
          else
            shipped=$(grep -Ev '(\.md$|^docs/|^\.ai/|^\.github/|^\.changeset/)' touched.txt || true)
            if [ -z "$shipped" ]; then
              echo "Docs/agent/CI-only change: no changeset needed."
            elif grep -E '^\.changeset/.+\.md$' changed.txt | grep -vxq '\.changeset/README\.md'; then
              echo "Changeset present."
            else
              echo "::error::This PR changes shipped files but adds no changeset. Run \`yarn changeset\` and commit the file."
              echo "Shipped files:"; printf '%s\n' "$shipped" | sed 's/^/  /'
              failed=1
            fi
          fi

          # Regression test: a bug fix (title type `fix` or label `bug`) changes a test,
          # unless the maintainer waived it.
          reason=""
          if grep -Eq '^fix(\([a-z0-9][a-z0-9._-]*\))?!?: ' title.txt; then
            reason="title type 'fix'"
          elif grep -qx 'bug' labels.txt; then
            reason="label 'bug'"
          fi
          if [ -n "$reason" ]; then
            if grep -qx 'skip-regression-test' labels.txt; then
              echo "Bug fix ($reason): regression test waived by the maintainer (skip-regression-test)."
            elif grep -Eq '(__tests__/|__integration__/|\.test\.[cm]?[jt]sx?$|\.spec\.[cm]?[jt]sx?$)' changed.txt; then
              echo "Bug fix ($reason): regression test present."
            else
              echo "::error::A bug fix ($reason) must add or change a test that fails without the fix. Only the maintainer may waive this with 'skip-regression-test'."
              failed=1
            fi
          fi
          exit "$failed"

  repo-checks:
    name: Repo checks
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Nothing to check
        if: needs.detect.outputs.agent-rules != 'true' && needs.detect.outputs.lessons != 'true'
        run: echo "No lessons or agent rules in this repository."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect.outputs.agent-rules == 'true' || needs.detect.outputs.lessons == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.detect.outputs.agent-rules == 'true' || needs.detect.outputs.lessons == 'true'
        with:
          node-version-file: ${{ needs.detect.outputs.nvmrc == 'true' && '.nvmrc' || '' }}
          node-version: ${{ needs.detect.outputs.nvmrc == 'true' && '' || '24' }}

      - name: Lessons
        if: needs.detect.outputs.lessons == 'true'
        run: node scripts/check-lessons.mjs

      - name: Install dependencies
        if: needs.detect.outputs.agent-rules == 'true'
        env:
          NPM_AUTH_TOKEN: ${{ github.token }}
        run: |
          corepack enable
          yarn install --immutable

      - name: sysvena-agent-rules check
        if: needs.detect.outputs.agent-rules == 'true'
        run: yarn sysvena-agent-rules check
