name: sysvena gates

# Shared PR gates for every sysvena repository. The org ruleset
# `require-sysvena-gates` requires this workflow on the default branch of every
# repository, so GitHub runs it on each PR without any file in that repository.
# It detects what to check from the repository itself:
#   - changeset:   `.changeset/config.json` exists on the base commit
#   - agent rules: package.json depends on `@sysvena/agent-rules`
#   - lessons:     `scripts/check-lessons.mjs` exists
# Dependency review runs in every repository (see the job for the policy).
# Workflow lockfile runs when `.github/workflows` has workflows (see the job).
#
# A ruleset runs a workflow only on the default `pull_request` activity types
# (opened, synchronize, reopened) and ignores `types`, so none are set here.
# The gates read the title, labels, body and files of the PR from the API, not from
# the event payload, so a re-run of an older run checks the current PR. The
# `detect` job reads the PR once and both gates use that one snapshot: the API
# can return the previous state for a few seconds after a change, and separate
# reads could then disagree. The log shows the snapshot that was checked.
#
# Workflows that upload artifacts set `retention-days: 7` (artifacts share the
# 2 GB Packages storage; the org keeps logs for 30 days).

on:
  pull_request:

concurrency:
  group: sysvena-gates-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent-rules: ${{ steps.detect.outputs.agent-rules }}
      lessons: ${{ steps.detect.outputs.lessons }}
      nvmrc: ${{ steps.detect.outputs.nvmrc }}
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - name: Gates version
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          echo "sysvena gates version: $WORKFLOW_SHA ($WORKFLOW_REF)"

      - name: Read the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # One line of compact JSON: jq escapes any newline inside the title.
          snapshot=$(gh api "repos/$REPO/pulls/$PR" --jq '{title: .title, labels: [.labels[].name], body: (.body // "")}' | jq -c .)
          echo "PR snapshot: $snapshot"
          echo "pr=$snapshot" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect
        id: detect
        run: |
          flag() { if eval "$1"; then echo true; else echo false; fi; }
          {
            echo "agent-rules=$(flag '[ -f package.json ] && grep -q "\"@sysvena/agent-rules\"" package.json')"
            echo "lessons=$(flag '[ -f scripts/check-lessons.mjs ]')"
            echo "nvmrc=$(flag '[ -f .nvmrc ]')"
          } | tee -a "$GITHUB_OUTPUT"

  pr-title:
    name: PR title
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the PR title
        env:
          PR_SNAPSHOT: ${{ needs.detect.outputs.pr }}
        run: |
          set -euo pipefail
          TITLE=$(jq -r '.title' <<< "$PR_SNAPSHOT")
          if [[ "$TITLE" == *$'\n'* || "$TITLE" == *$'\r'* ]]; then
            echo "::error::PR title must be one line."
            exit 1
          fi
          pattern='^(feat|fix|chore|docs|style|refactor|test|perf|ci|build|revert)(\([a-z0-9][a-z0-9._-]*\))?!?: [^ ].*$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must be '<type>(<area>): <summary>' with type feat, fix, chore, docs, style, refactor, test, perf, ci, build or revert (the types of @commitlint/config-conventional). Got: $TITLE"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters; keep it at 72 or fewer."
            exit 1
          fi
          echo "PR title OK: $TITLE"

  # PR description: every PR ends with the self-check of project rules §3 and
  # CODE_REVIEW.md: a "Sources/tests:" part, then a "Quality:" part, each with
  # content. The label may be bold (**Sources/tests:**) or a heading
  # (## Sources/tests:). Release PRs (`changeset-release/*`, written by the
  # Changesets action) and Dependabot PRs are exempt: no agent writes them.
  # Editing the description alone starts no run (see the header); re-run the
  # job after the edit.
  pr-description:
    name: PR description
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the PR description
        env:
          PR_SNAPSHOT: ${{ needs.detect.outputs.pr }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == changeset-release/* ]]; then
            echo "Release PR ($HEAD_REF): no self-check needed."
            exit 0
          fi
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then
            echo "Dependabot PR: no self-check needed."
            exit 0
          fi
          # HTML comments (the PR template's hints) are not content.
          jq -r '.body | gsub("(?s)<!--.*?-->"; "")' <<< "$PR_SNAPSHOT" | tr -d '\r' > body.txt
          # Prints "<sources line> <quality line> <sources content> <quality content>"
          # (line numbers of the first label of each kind, 0 when absent; content
          # = 1 when non-blank text follows the label before the next label, the
          # next heading, the "🤖 Generated with" attribution line or the end).
          read -r s q sc qc < <(awk '
            function label(name) { return $0 ~ "^(#+[ \t]+)?(\\*\\*)?" name ":(\\*\\*)?([ \t]|$)" }
            {
              rest = $0
              if ($0 ~ /^(#|🤖)/ && !label("Sources/tests") && !label("Quality")) { part = ""; next }
              if (label("Sources/tests") && !s) { s = NR; part = "s"; sub(/^.*Sources\/tests:(\*\*)?/, "", rest) }
              else if (label("Quality") && !q) { q = NR; part = "q"; sub(/^.*Quality:(\*\*)?/, "", rest) }
              if (rest ~ /[^ \t]/) { if (part == "s") sc = 1; else if (part == "q") qc = 1 }
            }
            END { print s + 0, q + 0, sc + 0, qc + 0 }' body.txt)
          if [ "$s" = 0 ] || [ "$q" = 0 ]; then
            echo "::error::The PR description must end with the self-check of project rules §3: a 'Sources/tests:' part, then a 'Quality:' part (bold or as headings)."
            exit 1
          fi
          if [ "$s" -gt "$q" ]; then
            echo "::error::In the PR description 'Sources/tests:' must come before 'Quality:'."
            exit 1
          fi
          if [ "$sc" = 0 ] || [ "$qc" = 0 ]; then
            echo "::error::'Sources/tests:' and 'Quality:' in the PR description each need content (for Quality, 'None.' when there is no gap)."
            exit 1
          fi
          echo "PR description has the self-check (Sources/tests: line $s, Quality: line $q)."

  changes:
    name: Regression test
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_SNAPSHOT: ${{ needs.detect.outputs.pr }}
        run: |
          set -euo pipefail
          jq -r '.title' <<< "$PR_SNAPSHOT" > title.txt
          jq -r '.labels[]' <<< "$PR_SNAPSHOT" > labels.txt
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.status != "removed") | .filename' > changed.txt
          echo "Changed files:"; sed 's/^/  /' changed.txt

          # Regression test: a bug fix (title type `fix` or label `bug`) changes a test,
          # unless the maintainer waived it. A test is a file under __tests__/,
          # __integration__/ or tests/, or a *.test.* / *.spec.* JS or TS file.
          reason=""
          if grep -Eq '^fix(\([a-z0-9][a-z0-9._-]*\))?!?: ' title.txt; then
            reason="title type 'fix'"
          elif grep -qx 'bug' labels.txt; then
            reason="label 'bug'"
          fi
          if [ -z "$reason" ]; then
            echo "Not a bug fix: no regression test needed."
          elif grep -qx 'skip-regression-test' labels.txt; then
            echo "Bug fix ($reason): regression test waived by the maintainer (skip-regression-test)."
          elif grep -Eq '(^|/)(__tests__|__integration__|tests)/|\.(test|spec)\.[cm]?[jt]sx?$' changed.txt; then
            echo "Bug fix ($reason): regression test present."
          else
            echo "::error::A bug fix ($reason) must add or change a test that fails without the fix. Only the maintainer may waive this with 'skip-regression-test'."
            exit 1
          fi

  # Changeset: the check Changesets documents for requiring changesets
  # ("Automating Changesets", blocking: `changeset status --since <base>`). It
  # fails when a package that Changesets versions changed and the PR adds no
  # changeset; a change that releases nothing adds `yarn changeset --empty`.
  # What counts as a change and which packages are versioned (private packages
  # only with `privatePackages.version`) comes from `.changeset/config.json`
  # of the BASE commit, so a PR cannot loosen its own check; a change to it
  # applies from the next PR. The CLI is the repository's own, installed from
  # its lockfile. The release PR (`changeset-release/*`) consumes changesets
  # and is exempt, as in the Changesets docs.
  changeset:
    name: Changeset
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare the changeset check
        id: prepare
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # The checkout is the PR's merge commit; its first parent is the base.
          base=$(git rev-parse HEAD^1)
          echo "Base commit: $base"
          run=false
          if [[ "$HEAD_REF" == changeset-release/* ]]; then
            echo "Release PR: no changeset needed."
          elif ! git cat-file -e "$base:.changeset/config.json" 2> /dev/null; then
            if [ -f .changeset/config.json ]; then
              echo "This PR adds Changesets: the changeset check applies from the next PR."
            else
              echo "No .changeset/config.json: changesets are not used in this repository."
            fi
          else
            mkdir -p .changeset
            git show "$base:.changeset/config.json" > .changeset/config.json
            if git diff --quiet HEAD -- .changeset/config.json; then
              echo "Using .changeset/config.json (unchanged by this PR)."
            else
              echo "Using .changeset/config.json of the base commit; this PR's change to it applies from the next PR."
            fi
            run=true
          fi
          { echo "run=$run"; echo "base=$base"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.prepare.outputs.run == 'true'
        # Exactly one of the two inputs is non-empty (see Repo checks).
        with:
          node-version-file: ${{ needs.detect.outputs.nvmrc == 'true' && '.nvmrc' || '' }}
          node-version: ${{ needs.detect.outputs.nvmrc != 'true' && '24' || '' }}

      - name: Install dependencies
        if: steps.prepare.outputs.run == 'true'
        env:
          NPM_AUTH_TOKEN: ${{ github.token }}
        run: |
          corepack enable
          yarn install --immutable

      - name: Check for a changeset
        if: steps.prepare.outputs.run == 'true'
        env:
          BASE: ${{ steps.prepare.outputs.base }}
        run: |
          if yarn changeset status --since "$BASE"; then
            echo "Changeset check OK."
          else
            echo "::error::A package that Changesets versions changed, but this PR adds no changeset. Run \`yarn changeset\` and commit the file, or \`yarn changeset --empty\` if the change releases nothing."
            exit 1
          fi

  repo-checks:
    name: Repo checks
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Nothing to check
        if: needs.detect.outputs.agent-rules != 'true' && needs.detect.outputs.lessons != 'true'
        run: echo "No lessons or agent rules in this repository."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect.outputs.agent-rules == 'true' || needs.detect.outputs.lessons == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.detect.outputs.agent-rules == 'true' || needs.detect.outputs.lessons == 'true'
        # Exactly one of the two inputs is non-empty: setup-node prefers
        # node-version when both are set, and `cond && '' || x` is always x.
        with:
          node-version-file: ${{ needs.detect.outputs.nvmrc == 'true' && '.nvmrc' || '' }}
          node-version: ${{ needs.detect.outputs.nvmrc != 'true' && '24' || '' }}

      - name: Node version
        if: needs.detect.outputs.agent-rules == 'true' || needs.detect.outputs.lessons == 'true'
        run: echo "Node $(node --version)"

      - name: Lessons
        if: needs.detect.outputs.lessons == 'true'
        run: node scripts/check-lessons.mjs

      - name: Install dependencies
        if: needs.detect.outputs.agent-rules == 'true'
        env:
          NPM_AUTH_TOKEN: ${{ github.token }}
        run: |
          corepack enable
          yarn install --immutable

      - name: sysvena-agent-rules check
        if: needs.detect.outputs.agent-rules == 'true'
        run: yarn sysvena-agent-rules check

  # Dependency review: a PR must not add a dependency with a known
  # vulnerability or with a licence outside the policy. GitHub's documented way
  # to enforce dependency review across an organization is a ruleset that
  # requires a workflow running actions/dependency-review-action; this is it.
  # The action compares the base and head commits through the dependency
  # review REST API, so the job needs no checkout and only `contents: read`.
  #
  # Policy (sysvena/mercato-platform#15, decided 2026-11-15):
  #   - Vulnerabilities of every severity (`low` and up) in every scope
  #     (runtime, development, unknown): development dependencies run in CI
  #     and on developer machines too (OWASP CICD-SEC-3).
  #   - Licences: an allow list (the action's maintainers deprecate deny lists,
  #     actions/dependency-review-action#938). ALLOW_LICENSES holds the
  #     licences that both Google's classification (notice or unencumbered)
  #     and the Blue Oak Council list (Bronze or better) rate permissive, plus
  #     CC-BY-4.0 for data. Everything else, including weak copyleft (MPL, EPL,
  #     LGPL), JSON and WTFPL, needs a reviewed exception.
  #   - A dependency with no detected licence fails. The action only reports it
  #     (actions/dependency-review-action#672; PR #1170 adds an option), so the
  #     step "Check unknown and excepted licences" fails it.
  #   - Exceptions live only here, so a PR cannot loosen its own check, and a
  #     change reaches the repositories through the gate release steps.
  #     LICENSE_EXCEPTIONS is a JSON array of {purl, license, reason}:
  #       purl    package URL without a version, e.g. "pkg:npm/elkjs",
  #               written as the dependency graph writes it ("%40" for "@")
  #       license the licence the dependency graph reports for it, as an SPDX
  #               expression, or NOASSERTION when it reports none
  #       reason  who reviewed it, when, and why it is acceptable
  #     An exception covers every version of the package, but the check fails
  #     when an added version reports a licence other than the approved one.
  #   - Vulnerabilities have no exceptions. If one ever cannot be fixed, add
  #     its GHSA id to `allow-ghsas` below with a comment, through a PR.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ALLOW_LICENSES: >-
        MIT, MIT-0, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD,
        BlueOak-1.0.0, Zlib, Python-2.0, AFL-2.1, AFL-3.0, CC0-1.0, Unlicense,
        CC-BY-4.0
      # Own packages: published to GitHub Packages, where the dependency graph
      # has no licence data, so it reports none (tested on gates-canary). Each
      # one gets an entry when it is first published; a scope-wide rule would
      # also pass a public package of the same name, as a purl does not say
      # which registry it came from.
      LICENSE_EXCEPTIONS: |
        [
          {"purl": "pkg:npm/%40sysvena/agent-rules", "license": "NOASSERTION",
           "reason": "Own proprietary package (sysvena), GitHub Packages; reviewed by the maintainer 2026-11-15."},
          {"purl": "pkg:npm/%40sysvena/default-locale", "license": "NOASSERTION",
           "reason": "Own proprietary package (sysvena), GitHub Packages; reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/%40sysvena/module-boundaries", "license": "NOASSERTION",
           "reason": "Own proprietary package (sysvena), GitHub Packages; reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/axe-core", "license": "MPL-2.0",
           "reason": "Dependency of eslint-plugin-jsx-a11y (eslint-config-next), development only. MPL-2.0 is file-level weak copyleft; used unmodified. Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-android-arm64", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-darwin-arm64", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-darwin-x64", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-freebsd-x64", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-linux-arm-gnueabihf", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-linux-arm64-gnu", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-linux-arm64-musl", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-linux-x64-gnu", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-linux-x64-musl", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-win32-arm64-msvc", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/lightningcss-win32-x64-msvc", "license": "MPL-2.0",
           "reason": "CSS compiler of Tailwind CSS 4 (@tailwindcss/node) in every Mercato app; platform binaries included. MPL-2.0 is file-level weak copyleft; used unmodified; listed in the image SBOM before any image reaches a centre (plan #2 step 11). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/%40img/sharp-win32-arm64", "license": "Apache-2.0 AND LGPL-3.0-or-later",
           "reason": "Prebuilt sharp for Windows or WebAssembly with libvips built in; installed only on those platforms, never in a Linux image. Same decision as @img/sharp-libvips-* (lawyer doc section 7). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/%40img/sharp-win32-ia32", "license": "Apache-2.0 AND LGPL-3.0-or-later",
           "reason": "Prebuilt sharp for Windows or WebAssembly with libvips built in; installed only on those platforms, never in a Linux image. Same decision as @img/sharp-libvips-* (lawyer doc section 7). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/%40img/sharp-win32-x64", "license": "Apache-2.0 AND LGPL-3.0-or-later",
           "reason": "Prebuilt sharp for Windows or WebAssembly with libvips built in; installed only on those platforms, never in a Linux image. Same decision as @img/sharp-libvips-* (lawyer doc section 7). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/%40img/sharp-wasm32", "license": "Apache-2.0 AND LGPL-3.0-or-later AND MIT",
           "reason": "Prebuilt sharp for Windows or WebAssembly with libvips built in; installed only on those platforms, never in a Linux image. Same decision as @img/sharp-libvips-* (lawyer doc section 7). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/uri-js", "license": "BSD-2-Clause AND BSD-2-Clause-Views",
           "reason": "Dependency of ESLint through ajv 6 (every Mercato app lints with ESLint). BSD-2-Clause-Views is BSD-2-Clause plus one sentence that the views are the authors' own, no further obligation; Blue Oak Silver, not classified by Google licenseclassifier, so an exception and not the allow list. Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/%40img/sharp-libvips-darwin-arm64", "license": "LGPL-3.0-or-later",
           "reason": "Prebuilt libvips for sharp; sharp is a required dependency of @open-mercato/core (attachments image checks) and of next. One shared library loaded at run time (LGPL-3.0 4d1). Obligations when an image is conveyed to a customer: lawyer doc section 7, plan #2 (SBOM, licence texts, source directions before any image reaches a centre). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/%40img/sharp-libvips-darwin-x64", "license": "LGPL-3.0-or-later",
           "reason": "Prebuilt libvips for sharp; sharp is a required dependency of @open-mercato/core (attachments image checks) and of next. One shared library loaded at run time (LGPL-3.0 4d1). Obligations when an image is conveyed to a customer: lawyer doc section 7, plan #2 (SBOM, licence texts, source directions before any image reaches a centre). Reviewed by the maintainer 2026-11-16."},
          {"purl": "pkg:npm/%40img/sharp-libvips-linux-arm", "license": "LGPL-3.0-or-later",
