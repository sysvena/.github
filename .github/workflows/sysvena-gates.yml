    steps:
      - name: Prepare licence exceptions
        id: exceptions
        run: |
          set -euo pipefail
          valid='type == "array" and all(.[];
            type == "object" and (keys - ["license", "purl", "reason"]) == []
            and (.purl | type == "string" and test("^pkg:[a-z]+/[^@?#,\\s]+$"))
            and (.license | type == "string" and test("^[^\\n\\r]+$"))
            and (.reason | type == "string" and test("\\S")))'
          if ! jq -e "$valid" <<< "$LICENSE_EXCEPTIONS" > /dev/null 2>&1; then
            echo "::error::LICENSE_EXCEPTIONS must be a JSON array of {purl, license, reason}, each purl 'pkg:<type>/<name>' without a version."
            exit 1
          fi
          echo "Licence exceptions: $(jq length <<< "$LICENSE_EXCEPTIONS")"
          jq -r '.[] | "  \(.purl): \(.license) (\(.reason))"' <<< "$LICENSE_EXCEPTIONS"
          echo "purls=$(jq -r 'map(.purl) | join(", ")' <<< "$LICENSE_EXCEPTIONS")" >> "$GITHUB_OUTPUT"

      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          allow-licenses: ${{ env.ALLOW_LICENSES }}
          allow-dependencies-licenses: ${{ steps.exceptions.outputs.purls }}

      - name: Check unknown and excepted licences
        if: ${{ !cancelled() && steps.exceptions.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          INVALID_LICENSES: ${{ steps.review.outputs.invalid-license-changes }}
        run: |
          set -euo pipefail
          failed=0

          # Unknown licences: the action lists them under `unlicensed` (after it
          # has also asked GitHub for the licence of the source repository) and
          # leaves excepted packages out.
          if [ -z "$INVALID_LICENSES" ]; then
            if [ "$REVIEW_OUTCOME" = success ]; then
              echo "::error::Dependency review succeeded but reported no licence result."
            else
              echo "::error::Dependency review failed before it reported licences; see the step above."
            fi
            failed=1
          else
            unknown=$(jq -r '.unlicensed[]? | "  \(.manifest) » \(.name)@\(.version) (\(.package_url))"' <<< "$INVALID_LICENSES")
            if [ -n "$unknown" ]; then
              echo "::error::Added dependencies with no detected licence. Find out the licence; if it is acceptable, add a reviewed exception (license NOASSERTION) to LICENSE_EXCEPTIONS in sysvena/.github."
              printf '%s\n' "$unknown"
              failed=1
            else
              echo "Every added dependency has a detected licence or a reviewed exception."
            fi
          fi

          # Excepted packages must still have the licence that was approved.
          if [ "$(jq length <<< "$LICENSE_EXCEPTIONS")" -gt 0 ]; then
            gh api --paginate "repos/$REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" --jq '.[]' \
              | jq -s . > dependency-changes.json
            changed=$(jq -r --argjson ex "$LICENSE_EXCEPTIONS" '
              def base: ascii_downcase | sub("[?#].*$"; "") | sub("@[^/@]*$"; "");
              .[] | select(.change_type == "added") | . as $c
              | ($ex[] | select((.purl | base) == ($c.package_url | base))) as $e
              | ($c.license // "NOASSERTION") as $got
              | select($got != $e.license)
              | "  \($c.manifest) » \($c.name)@\($c.version): reports \($got), the exception approved \($e.license) (\($e.purl))"
              ' dependency-changes.json)
            if [ -n "$changed" ]; then
              echo "::error::Excepted dependencies now report a different licence. Review the new licence and update the exception in sysvena/.github."
              printf '%s\n' "$changed"
              failed=1
            else
              echo "Every excepted dependency still has its approved licence."
            fi
          fi
          exit "$failed"

  # Workflow lockfile: a repository with workflows keeps
  # `.github/workflows/actions.lock`, generated by `gh actions-lock`
  # (github/gh-actions-lock), which pins every action the workflows use,
  # including transitive dependencies, to a commit plus the owner and
  # repository IDs; the runner then runs the locked versions. This job is the
  # PR check the extension's docs recommend (`--verify`), and it also stands in
  # for the "Require lockfile" policy, which needs GitHub Enterprise: without
  # it the runner ignores a missing or unreadable lockfile
  # (github/gh-actions-lock#125). The policy lives here, so a PR cannot loosen
  # its own check.
  #
  # Policy (sysvena/mercato-platform#15, decided 2026-11-15, tested on
  # gates-canary):
  #   - Workflows present => the lockfile must exist and verify.
  #   - Every action a workflow uses directly is pinned to a commit SHA.
  #   - Lock with `--no-narrow`, keeping `uses: …@<sha> # vX.Y.Z`: with SHA
  #     refs the runner refuses a locked commit that differs from the pin
  #     (with tag refs it ran any locked commit), tag refs let Dependabot
  #     propose an unmerged branch named like a version
  #     (github/gh-actions-lock#273), and Dependabot relocks with `--no-narrow`.
  #   - The job fails on a non-zero exit (every `error`, including a GitHub
  #     API that did not answer, `reachability-unknown`) and on every other
  #     finding (`warning`, `info`) except `sha-as-ref`, which `--no-narrow`
  #     reports for every SHA pin by design.
  #
  # The extension's binary runs on its own (as Dependabot runs it), pinned by
  # version and SHA-256. To update it: download the linux-amd64 asset of the
  # release, `gh attestation verify <file> --repo github/gh-actions-lock`, and
  # compare its SHA-256 with the one dependabot-core pins
  # (github_actions/Dockerfile).
  workflow-lockfile:
    name: Workflow lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_ACTIONS_LOCK_VERSION: v0.4.1
      GH_ACTIONS_LOCK_SHA256: 39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find workflows
        id: find
        run: |
          set -euo pipefail
          # GitHub runs only the YAML files directly in .github/workflows.
          found=""
          if [ -d .github/workflows ]; then
            found=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          fi
          if [ -z "$found" ]; then
            echo "No workflows: no lockfile needed."
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          else
            echo "Workflows:"; printf '  %s\n' "$found"
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install gh-actions-lock
        if: steps.find.outputs.workflows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_BIN: ${{ runner.temp }}/gh-actions-lock
        run: |
          set -euo pipefail
          if [ "$(uname -s)-$(uname -m)" != "Linux-x86_64" ]; then
            echo "::error::The pinned gh-actions-lock binary is linux-amd64; this runner is $(uname -s)-$(uname -m)."
            exit 1
          fi
          gh release download "$GH_ACTIONS_LOCK_VERSION" -R github/gh-actions-lock -p linux-amd64 -O "$LOCK_BIN" --clobber
          if ! echo "$GH_ACTIONS_LOCK_SHA256  $LOCK_BIN" | sha256sum -c --strict --quiet -; then
            echo "::error::gh-actions-lock $GH_ACTIONS_LOCK_VERSION (linux-amd64) does not have the pinned SHA-256."
            exit 1
          fi
          chmod +x "$LOCK_BIN"
          echo "gh-actions-lock $GH_ACTIONS_LOCK_VERSION installed, SHA-256 verified."

      - name: Verify the lockfile
        if: steps.find.outputs.workflows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_BIN: ${{ runner.temp }}/gh-actions-lock
        run: |
          set -euo pipefail
          lockfile=.github/workflows/actions.lock
          if [ ! -f "$lockfile" ]; then
            echo "::error::This repository has workflows but no $lockfile. Run \`gh actions-lock --no-narrow\` and commit the file (see sysvena/.github README, \"Workflow lockfile\")."
            exit 1
          fi
          status=0
          "$LOCK_BIN" --verify --no-interactive --json > verify.json 2> verify.log || status=$?
          sed 's/^/  /' verify.log
          if ! jq -e 'type == "object" and (.valid | type == "boolean") and (.findings | type == "array") and (.workflows | type == "array")' verify.json > /dev/null 2>&1; then
            echo "::error::gh-actions-lock failed (exit $status) without a result; see the log above."
            exit 1
          fi
          jq -r '.findings[] | "  \(.severity) \(.category): \(.dependency // .workflow // "-") \(.detail // "")"' verify.json
          blocking=$(jq '[.findings[] | select(.category != "sha-as-ref")] | length' verify.json)
          if [ "$status" -ne 0 ] || [ "$(jq -r .valid verify.json)" != true ]; then
            echo "::error::The workflow lockfile does not verify (exit $status). Fix the findings above; run \`gh actions-lock --no-narrow\` after changing a workflow, and never edit the lockfile by hand."
            exit 1
          fi
          if [ "$blocking" -gt 0 ]; then
            echo "::error::The workflow lockfile verifies, but has $blocking finding(s) the policy does not accept (every one except sha-as-ref). Fix them; see https://github.com/github/gh-actions-lock/blob/main/docs/troubleshooting.md."
            exit 1
          fi
          # Direct `uses:` refs must be commit SHAs (the --no-narrow policy above).
          # Transitive ones belong to the actions' maintainers; the lockfile
          # pins them to a commit either way.
          unpinned=$(jq -r '.workflows[] | .path as $p | .dependencies[]?
            | select(.direct == true and ((.ref // "") | test("^[0-9a-f]{40}$") | not))
            | "  \($p): \(.nwo)@\(.ref)"' verify.json)
          if [ -n "$unpinned" ]; then
            echo "::error::Pin every action in the workflows to a full commit SHA with its release in a comment (uses: owner/repo@<sha> # vX.Y.Z), then run \`gh actions-lock --no-narrow\`. Not pinned:"
            printf '%s\n' "$unpinned"
            exit 1
          fi
          echo "Workflow lockfile OK ($(jq '.findings | length' verify.json) sha-as-ref warning(s), expected with SHA pins)."
